services:
  db:
    image: postgres:16-alpine
    container_name: focustask_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: brainboard
      POSTGRES_PASSWORD: brainboard
      POSTGRES_DB: brainboard
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brainboard -d brainboard"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - focustask_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: focustask_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://brainboard:brainboard@db:5432/brainboard
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - focustask_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: focustask_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - focustask_network

networks:
  focustask_network:
    driver: bridge

volumes:
  postgres_data:
